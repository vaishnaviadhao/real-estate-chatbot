<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal and Wasalt Assistant</title>
<style>
:root{--bg:#f6f7f5;--ink:#1d2623;--mut:#5d6b66;--line:#d7ddd9;--me:#1f4d43;--bot:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--ink:#e6ece9;--mut:#93a39c;--line:#2a3532;--me:#2f7a69;--bot:#1c2421;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,serif;display:flex;flex-direction:column;height:100dvh}
header{padding:16px 20px;border-bottom:1px solid var(--line)}
h1{font-size:1.1rem;margin:0}header p{margin:2px 0 0;color:var(--mut);font:.85rem system-ui,sans-serif}
#log{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto}
.m{margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;max-width:85%}
.u{background:var(--me);color:#fff;border-color:var(--me);margin-left:auto}.b{background:var(--bot)}
.s{display:block;margin-top:8px;font:.78rem system-ui,sans-serif;color:var(--mut);word-break:break-all}
form{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bot);color:var(--ink);font:inherit}
button{padding:0 18px;border:0;border-radius:8px;background:var(--me);color:#fff;font:600 .95rem system-ui,sans-serif;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
</style></head><body>
<header><h1>DarGlobal and Wasalt Assistant</h1><p>Answers come from public pages of both websites.</p></header>
<div id="log"><div class="m b">Ask about DarGlobal projects, Wasalt listings, or either company.</div></div>
<form id="f"><input id="q" placeholder="Ask a question" autocomplete="off" required><button>Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q');let hist=[];
function add(t,c,src){const d=document.createElement('div');d.className='m '+c;d.textContent=t;
 if(src&&src.length){const s=document.createElement('span');s.className='s';s.textContent='Sources: '+src.slice(0,4).join(', ');d.appendChild(s)}
 log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=q.value.trim();if(!m)return;q.value='';
 add(m,'u');const w=add('Thinking...','b');
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:hist})});
  const j=await r.json();if(!r.ok)throw new Error(j.detail||r.status);
  w.remove();add(j.answer,'b',j.sources);hist.push({role:'user',content:m},{role:'assistant',content:j.answer})}
 catch(x){w.textContent='Error: '+x.message}};
</script></body></html>
